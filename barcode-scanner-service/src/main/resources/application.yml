server:
  port: 8084

spring:
  application:
    name: barcode-scanner-service

ingest:
  # ingest-service 접속 주소: localhost or ingest (Docker Service Name)
  base-url: ${INGEST_BASE_URL:http://localhost:8081}

# Prometheus Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

app:
  scanner:
    device-id: "SEOUL-CENTER-PC-001"
    batch-size-limit: 250

retry:
  max-queue-size: 10000  # 재시도 큐 최대 크기 (메모리 보호)

logging:
  level:
    com.barcode.barcode_scanner_service: DEBUG