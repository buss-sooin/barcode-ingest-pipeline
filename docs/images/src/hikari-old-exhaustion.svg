<text x="70" y="28" font-size="18" font-weight="600" fill="#0b0b0b">구형(기존 동기 방식) 서버 — DB 연결이 가득 차 요청이 밀리는 상황 재현</text>
<text x="70" y="50" font-size="13" fill="#52514e">동시 요청 30개, 서버 지표를 2초 간격으로 직접 수집</text>
<text x="70" y="70" font-size="13" fill="#3a5f8a">DB 연결은 최대 10개뿐인데 요청이 몰리자 곧바로 다 차고(파란선), 나머지 요청은 커넥션을 확보하지 못해 대기 상태로 쌓임(주황선).</text>
<text x="70" y="88" font-size="13" fill="#3a5f8a">이 대기가 뒤 단계(센터-본사 동기화)까지 지연시킴.</text>
