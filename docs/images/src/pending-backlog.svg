<text x="70" y="28" font-size="18" font-weight="600" fill="#0b0b0b">구형(기존 동기 방식) 서버 — 장애 중 밀린 미전송 바코드 건수 추이</text>
<text x="70" y="48" font-size="13" fill="#52514e">3초 간격으로 직접 수집</text>
<text x="70" y="66" font-size="13" fill="#3a5f8a">바코드 중복 전송을 막기 위해, 스캔한 바코드는 본사 DB에 전송 완료돼야 처리 완료로 표시됨(레거시 설계).</text>
<text x="70" y="84" font-size="13" fill="#3a5f8a">본사 서버가 과부하로 느려지면 이 전송이 밀려 처리 완료 표시가 안 되고 계속 쌓임 — 아래 그래프가 그 적체량.</text>
