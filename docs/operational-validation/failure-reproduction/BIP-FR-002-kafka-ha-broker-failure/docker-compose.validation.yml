name: bip-fr-002-kafka-ha

x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0-1-ubi9
x-kafka-cluster-id: &kafka-cluster-id MkU3OEVBNTcwNTJENDM2Qk
x-kafka-bootstrap: &kafka-bootstrap broker-1:29092,broker-2:29092,broker-3:29092
x-kafka-broker-environment: &kafka-broker-environment
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_COMPRESSION_TYPE: snappy
  CLUSTER_ID: *kafka-cluster-id

services:
  # KRaft metadata만 담당한다. 애플리케이션 트래픽이나 partition replica를 수용하지 않는다.
  controller:
    image: *kafka-image
    container_name: bip-fr-002-controller
    hostname: controller
    networks: [bip-fr-002-net]
    environment:
      KAFKA_NODE_ID: 100
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:29093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: *kafka-cluster-id
    volumes:
      - kafka-controller-data:/var/lib/kafka/data

  broker-1:
    image: *kafka-image
    container_name: bip-fr-002-broker-1
    hostname: broker-1
    networks: [bip-fr-002-net]
    depends_on:
      controller:
        condition: service_started
    ports:
      - "19092:9092"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:29092,HOST://localhost:19092
    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  broker-2:
    image: *kafka-image
    container_name: bip-fr-002-broker-2
    hostname: broker-2
    networks: [bip-fr-002-net]
    depends_on:
      controller:
        condition: service_started
    ports:
      - "19093:9092"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:29092,HOST://localhost:19093
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  broker-3:
    image: *kafka-image
    container_name: bip-fr-002-broker-3
    hostname: broker-3
    networks: [bip-fr-002-net]
    depends_on:
      controller:
        condition: service_started
    ports:
      - "19094:9092"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:29092,HOST://localhost:19094
    volumes:
      - kafka-broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # 자동 생성은 비활성화되어 있다. 이 one-shot service가 계약 토픽을 생성·검증해야
  # application service의 service_completed_successfully 조건이 열린다.
  topic-init:
    image: *kafka-image
    container_name: bip-fr-002-topic-init
    networks: [bip-fr-002-net]
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
    volumes:
      - ./init-kafka-topics.sh:/opt/bip-fr-002/init-kafka-topics.sh:ro
    command: ["/bin/sh", "/opt/bip-fr-002/init-kafka-topics.sh"]
    restart: "no"

  mysql:
    image: mysql:8
    container_name: bip-fr-002-mysql
    networks: [bip-fr-002-net]
    ports:
      - "13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --plugin-load-add=mysql_native_password.so
      - --performance-schema=ON
      - --slow-query-log=1
      - --slow-query-log-file=/var/log/mysql/mysql-slow.log
      - --long-query-time=0.01
      - --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:?MYSQL_EXPORTER_USER is required}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    volumes:
      - ../../../../mysql-init/init_exporter_user.sh:/docker-entrypoint-initdb.d/init_exporter_user.sh:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: bip-fr-002-redis
    networks: [bip-fr-002-net]
    ports:
      - "16379:6379"
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 24

  ingest:
    build: ../../../../barcode-ingest-service
    container_name: bip-fr-002-ingest
    networks: [bip-fr-002-net]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      SPRING_KAFKA_PRODUCER_ACKS: all
    ports:
      - "18081:8081"

  processing:
    build: ../../../../barcode-processing-service
    container_name: bip-fr-002-processing
    networks: [bip-fr-002-net]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      SPRING_KAFKA_PRODUCER_ACKS: all
      REDIS_HOST: redis
    ports:
      - "18082:8082"

  scanner:
    build: ../../../../barcode-scanner-service
    container_name: bip-fr-002-scanner
    networks: [bip-fr-002-net]
    depends_on:
      ingest:
        condition: service_started
    environment:
      INGEST_BASE_URL: http://ingest:8081
    ports:
      - "18084:8084"

  worker-1:
    build: ../../../../barcode-persistence-worker
    container_name: bip-fr-002-worker-1
    networks: [bip-fr-002-net]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: ${WORKER1_PORT:?WORKER1_PORT is required}
      WORKER_NAME: ${WORKER1_NAME:?WORKER1_NAME is required}
      REDIS_HOST: redis
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "18085:8085"

  worker-2:
    build: ../../../../barcode-persistence-worker
    container_name: bip-fr-002-worker-2
    networks: [bip-fr-002-net]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: ${WORKER2_PORT:?WORKER2_PORT is required}
      WORKER_NAME: ${WORKER2_NAME:?WORKER2_NAME is required}
      REDIS_HOST: redis
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "18086:8086"

networks:
  bip-fr-002-net:
    name: bip-fr-002-net
    driver: bridge

volumes:
  kafka-controller-data:
  kafka-broker-1-data:
  kafka-broker-2-data:
  kafka-broker-3-data:
  mysql-data:
  redis-data:
