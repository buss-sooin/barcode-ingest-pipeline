name: bip-fr-006-kafka-dr

x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0-1-ubi9
x-cluster-a-id: &cluster-a-id MkU3OEVBNTcwNTJENDM2Qk
x-cluster-b-id: &cluster-b-id NqnEdODVKkiLTfJvqd1uqQ
x-cluster-a-bootstrap: &cluster-a-bootstrap broker-a-1:29092,broker-a-2:29092,broker-a-3:29092
x-cluster-b-bootstrap: &cluster-b-bootstrap broker-b:39092
x-kafka-a-environment: &kafka-a-environment
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller-a:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 24
  KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
  CLUSTER_ID: *cluster-a-id

services:
  controller-a:
    image: *kafka-image
    container_name: bip-fr-006-controller-a
    hostname: controller-a
    networks: [cluster-a-net]
    mem_limit: 384m
    environment:
      KAFKA_NODE_ID: 100
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller-a:29093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms64m -Xmx192m
      CLUSTER_ID: *cluster-a-id
    volumes:
      - kafka-a-controller-data:/var/lib/kafka/data

  broker-a-1:
    image: *kafka-image
    container_name: bip-fr-006-broker-a-1
    hostname: broker-a-1
    networks: [cluster-a-net]
    mem_limit: 640m
    depends_on:
      controller-a:
        condition: service_started
    ports: ["29092:9092"]
    environment:
      <<: *kafka-a-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-a-1:29092,HOST://localhost:29092
    volumes:
      - kafka-a-broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  broker-a-2:
    image: *kafka-image
    container_name: bip-fr-006-broker-a-2
    hostname: broker-a-2
    networks: [cluster-a-net]
    mem_limit: 640m
    depends_on:
      controller-a:
        condition: service_started
    ports: ["29093:9092"]
    environment:
      <<: *kafka-a-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-a-2:29092,HOST://localhost:29093
    volumes:
      - kafka-a-broker-2-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  broker-a-3:
    image: *kafka-image
    container_name: bip-fr-006-broker-a-3
    hostname: broker-a-3
    networks: [cluster-a-net]
    mem_limit: 640m
    depends_on:
      controller-a:
        condition: service_started
    ports: ["29094:9092"]
    environment:
      <<: *kafka-a-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-a-3:29092,HOST://localhost:29094
    volumes:
      - kafka-a-broker-3-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  topic-init-a:
    image: *kafka-image
    container_name: bip-fr-006-topic-init-a
    networks: [cluster-a-net]
    mem_limit: 256m
    depends_on:
      broker-a-1: {condition: service_healthy}
      broker-a-2: {condition: service_healthy}
      broker-a-3: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-a-bootstrap
      TOPIC_REPLICATION_FACTOR: 3
      TOPIC_MIN_ISR: 2
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    volumes:
      - ./init-kafka-topics.sh:/opt/fr006/init-kafka-topics.sh:ro
    command: ["/bin/sh", "/opt/fr006/init-kafka-topics.sh"]
    restart: "no"

  broker-b:
    image: *kafka-image
    container_name: bip-fr-006-broker-b
    hostname: broker-b
    networks: [cluster-b-net]
    mem_limit: 704m
    ports: ["39092:9092"]
    environment:
      KAFKA_NODE_ID: 201
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 201@broker-b:39093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:39092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:39093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-b:39092,HOST://localhost:39092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      CLUSTER_ID: *cluster-b-id
    volumes:
      - kafka-b-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:39092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  topic-init-b:
    image: *kafka-image
    container_name: bip-fr-006-topic-init-b
    networks: [cluster-b-net]
    mem_limit: 256m
    depends_on:
      broker-b: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-b-bootstrap
      TOPIC_REPLICATION_FACTOR: 1
      TOPIC_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    volumes:
      - ./init-kafka-topics.sh:/opt/fr006/init-kafka-topics.sh:ro
    command: ["/bin/sh", "/opt/fr006/init-kafka-topics.sh"]
    restart: "no"

  mm2:
    image: *kafka-image
    container_name: bip-fr-006-mm2
    hostname: mm2
    networks: [cluster-a-net, cluster-b-net]
    mem_limit: 640m
    depends_on:
      topic-init-a: {condition: service_completed_successfully}
      topic-init-b: {condition: service_completed_successfully}
    ports: ["18083:8083"]
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx320m
      KAFKA_LOG4J_OPTS: -Dlog4j2.configurationFile=/etc/kafka/connect-log4j2.yaml
    volumes:
      - ./mm2.properties:/etc/kafka/mm2.properties:ro
    command: ["connect-mirror-maker", "/etc/kafka/mm2.properties"]
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: bip-fr-006-mysql
    networks: [shared-net]
    mem_limit: 640m
    ports: ["23306:3306"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --plugin-load-add=mysql_native_password.so
      - --performance-schema=ON
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:?MYSQL_EXPORTER_USER is required}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    volumes:
      - ../../../../mysql-init/init_exporter_user.sh:/docker-entrypoint-initdb.d/init_exporter_user.sh:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: bip-fr-006-redis
    networks: [shared-net]
    mem_limit: 128m
    ports: ["26379:6379"]
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest-a:
    build: ../../../../barcode-ingest-service
    image: bip-fr-006-ingest:local
    container_name: bip-fr-006-ingest-a
    networks: [cluster-a-net]
    mem_limit: 320m
    depends_on:
      topic-init-a: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-a-bootstrap
      SPRING_KAFKA_PRODUCER_ACKS: all
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
    ports: ["28081:8081"]

  ingest-b:
    profiles: [failover]
    image: bip-fr-006-ingest:local
    container_name: bip-fr-006-ingest-b
    networks: [cluster-b-net]
    mem_limit: 320m
    depends_on:
      topic-init-b: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-b-bootstrap
      SPRING_KAFKA_PRODUCER_ACKS: all
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
    ports: ["28091:8081"]

  processing-a:
    build: ../../../../barcode-processing-service
    image: bip-fr-006-processing:local
    container_name: bip-fr-006-processing-a
    networks: [cluster-a-net, shared-net]
    mem_limit: 352m
    depends_on:
      topic-init-a: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-a-bootstrap
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m
    ports: ["28082:8082"]

  processing-b:
    profiles: [failover]
    image: bip-fr-006-processing:local
    container_name: bip-fr-006-processing-b
    networks: [cluster-b-net, shared-net]
    mem_limit: 352m
    depends_on:
      topic-init-b: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *cluster-b-bootstrap
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m
    ports: ["28092:8082"]

  worker:
    build: ../../../../barcode-persistence-worker
    image: bip-fr-006-worker:local
    container_name: bip-fr-006-worker
    networks: [shared-net]
    mem_limit: 448m
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SERVER_PORT: 8085
      WORKER_NAME: fr006-worker
      REDIS_HOST: redis
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    ports: ["28085:8085"]

networks:
  cluster-a-net:
    name: bip-fr-006-cluster-a-net
    driver: bridge
  cluster-b-net:
    name: bip-fr-006-cluster-b-net
    driver: bridge
  shared-net:
    name: bip-fr-006-shared-net
    driver: bridge

volumes:
  kafka-a-controller-data:
  kafka-a-broker-1-data:
  kafka-a-broker-2-data:
  kafka-a-broker-3-data:
  kafka-b-data:
  mysql-data:
  redis-data:
