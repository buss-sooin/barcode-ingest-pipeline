version: '3.8'

# 전체 스택 기동/종료 (인프라 + 앱 + 관측). 저장소 루트에서 실행한다.
#   up:   docker compose -f docker-compose.yml -f docker-compose.apps.yml -f monitoring-compose.yml up -d --build
#   down: docker compose -f docker-compose.yml -f docker-compose.apps.yml -f monitoring-compose.yml down -v --remove-orphans
#
# down에서 -v를 빼면 prometheus-data/grafana-data와 mysql이 만드는 익명 볼륨이 남아 계속 쌓인다.
# -p로 프로젝트 이름을 따로 주면 볼륨 이름이 달라져 up과 down의 짝이 어긋난다. 폴더명 기본값을 쓴다.

# barcode-persistence-worker를 이 compose에 추가할 때: WORKER_NAME(consumer-name)은 인스턴스마다
# 재기동 후에도 항상 같은 값으로 고정해야 한다. 바뀌면 이전 PEL을 회수하지 못해 미처리 메시지가 고아가 된다.

services:
  kafka:
    networks: [monitoring-net]
    image: confluentinc/cp-kafka:8.1.0-1-ubi9
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: 'snappy'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    # volumes:
    #   - kafka-data:/var/lib/kafka/data

  mysql:
    networks: [monitoring-net]
    image: mysql:8
    container_name: mysql
    ports:
      - "3306:3306"
    command: 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci
      --plugin-load-add=mysql_native_password.so
      --performance-schema=ON
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/mysql-slow.log
      --long-query-time=0.01
      --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    volumes:
      - ./mysql-init/init_exporter_user.sh:/docker-entrypoint-initdb.d/init_exporter_user.sh
    #   - mysql-data:/var/lib/mysql

  redis:
    networks: [monitoring-net]
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    # volumes:
    #   - redis-data:/data

# volumes:
#   kafka-data:
#   mysql-data:
#   redis-data:

networks:
  monitoring-net:
    driver: bridge