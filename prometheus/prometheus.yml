# prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ========================================
  # Spring Boot Applications
  # ========================================
  - job_name: 'spring-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # NEW Architecture — 항목 7에서 docker-compose.apps.yml로 컨테이너화됨.
      # monitoring-net을 Prometheus와 공유하므로 컨테이너 이름으로 직접 스크레이프한다.
      - targets: ['ingest:8081']
        labels:
          application: 'ingest-service'
          architecture: 'new'

      - targets: ['processing:8082']
        labels:
          application: 'processing-service'
          architecture: 'new'

      - targets: ['worker-1:8085']
        labels:
          application: 'worker-1'
          architecture: 'new'
          worker_instance: '1'

      - targets: ['worker-2:8086']
        labels:
          application: 'worker-2'
          architecture: 'new'
          worker_instance: '2'

      # OLD Architecture — barcode-old-pipeline은 별도 compose 프로젝트라
      # monitoring-net에 없다. 컨테이너화 이후에도 포트를 호스트에 발행하므로
      # host.docker.internal 그대로 유지한다.
      - targets: ['host.docker.internal:9091']
        labels:
          application: 'delivery-monolith'
          architecture: 'old'

      - targets: ['scanner:8084']
        labels:
          application: 'scanner-service'
          architecture: 'new'

  # ========================================
  # MySQL Exporters
  # ========================================
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          database: 'barcode_db'
          architecture: 'new'

  - job_name: 'mysql_central'
    static_configs:
      - targets: ['mysqld-exporter-central:9104']
        labels:
          database: 'barcode_central'
          architecture: 'old'

  # ========================================
  # Kafka / Redis Exporters
  # ========================================
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']